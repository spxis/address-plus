name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these same checks before it publishes anything.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Lint, typecheck, test, test:types, schema:validate, build and test:package, in that order.
      - run: pnpm check
